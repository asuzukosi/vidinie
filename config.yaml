# flat configuration file
# all values are at the root level for easy loading

# api keys (loaded from environment variables, can be overridden here)
anthropic_api_key: null
replicate_api_token: null
elevenlabs_api_key: null
pexels_api_key: null

# content settings
content_chunk_length: 4000

# output settings
output_directory: "output"
output_temp_directory: "temp"
output_codec: "libx264"
output_audio_codec: "aac"

# path settings
paths_prompts_directory: "core/prompts"

# font settings
fonts_fonts_directory: "fonts"
fonts_default_font: null
