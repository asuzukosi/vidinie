
services:
  vidinie-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    networks:
      - vidinie-network
    ports:
      - "8000:8000"
    environment:
      - .env
      - CELERY_BROKER_URL=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
    depends_on:
      # - mongodb
      - redis
    volumes:
      - ./core/:/app/core
      - ./api/:/app/api
      - ./outputs:/app/outputs
  vidinie-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    networks:
      - vidinie-network
    ports:
      - "3000:3000"
    environment:
      - .env
    depends_on:
      - vidinie-backend
      - mongodb
    # volumes:
    #   - ./frontend/src:/app/src
    #   - ./frontend/components:/app/components
    #   - ./frontend/lib:/app/lib
    #   - ./frontend/hooks:/app/hooks


  vidinie-celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: celery
    networks:
      - vidinie-network
    environment:
      - .env
      - CELERY_BROKER_URL=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
    depends_on:
      # - mongodb
      - redis
    volumes:
      - ./outputs:/app/outputs
      - ./core/:/app/core
      - ./api/:/app/api
    
  mongodb:
    image: mongo:latest
    container_name: mongodb
    networks:
      - vidinie-network
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  redis:
    image: redis:7-alpine
    networks:
      - vidinie-network
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
networks:
  vidinie-network:
volumes:
  mongodb-data:
  redis-data: